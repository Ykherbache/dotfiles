[ids]
*

[main]
k = overload(control, k)
h = overloadt(hyper, h, 200)
j = overloadt(move, j, 200)

[hyper:S-M]
j = j
p = command(/usr/local/bin/gnome-ws toggle)

[move]
h = noop
a = command(/usr/local/bin/gnome-ws move 1)
s = command(/usr/local/bin/gnome-ws move 2)
d = command(/usr/local/bin/gnome-ws move 3)
f = command(/usr/local/bin/gnome-ws move 4)
g = command(/usr/local/bin/gnome-ws move 5)
z = command(/usr/local/bin/gnome-ws move 6)
x = command(/usr/local/bin/gnome-ws move 7)
c = command(/usr/local/bin/gnome-ws move 8)
v = command(/usr/local/bin/gnome-ws move 9)
q = command(/usr/local/bin/gnome-ws move 10)
w = command(/usr/local/bin/gnome-ws move 11)
e = command(/usr/local/bin/gnome-ws move 12)
r = command(/usr/local/bin/gnome-ws move last)
